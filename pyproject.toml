[project]
name = "lego-creator"
version = "0.0.1"
description = "Tooling for original LEGO SPIKE Prime builds: LDraw models, BOM checks, instructions, Pybricks code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "weasyprint>=70.0",
]

[project.scripts]
lc = "lego_creator.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
